extends: common.yaml
name: school_smoke
purpose: School correctness smoke test; not a result-producing experiment.
model_min_parameters: 0
runtime:
  gpu_count: 3
  min_vram_gib_per_gpu: 45
  min_free_vram_gib_per_gpu: 40
  min_cpu_ram_gib: 64
upstream:
  data:
    train_batch_size: 6
    val_batch_size: 6
    train_data_num: 60
    val_data_num: 12
  actor_rollout_ref:
    model:
      path: Qwen/Qwen2.5-1.5B-Instruct
    actor:
      ppo_mini_batch_size: 6
      ppo_micro_batch_size: 3
    rollout:
      n_agent: 2
      log_prob_micro_batch_size: 3
    ref:
      log_prob_micro_batch_size: 3
  trainer:
    n_gpus_per_node: 3
    total_training_steps: 5
    save_freq: 5
    test_freq: 5
  max_turns: 3

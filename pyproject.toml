[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "procurement-search-rl"
version = "0.1.0"
description = "Auditable simulated procurement tasks and Search-R1 / IGPO experiments"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
data = ["pandas>=1.5,<3", "pyarrow>=12,<20"]
config = ["PyYAML>=6,<7"]
dev = ["pytest>=7,<9", "PyYAML>=6,<7"]

[project.scripts]
procurement-rl = "procurement_rl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
